\* Writes never fail, so the reader must always catch up to the max read
\* level and persist that ack level (see findings.md #1 for why this needs
\* WriteErrors = FALSE).
SPECIFICATION PriSpec
CONSTANTS
  MaxLevel = 3
  InitLevels = 1
  BatchSize = 2
  ReloadAt = 1
  RangeSize = 1
  ScanIters = 2
  WBatchMax = 2
  AckableLevels = {1, 2, 3}
  Expirable = {}
  WriteErrors = FALSE
  ReadErrors = TRUE
  MutStaleGapLevels = FALSE
  MutNoAckedTaskFilter = FALSE
  MutDbAckBackwards = FALSE
  MutSignalAlwaysOnGap = FALSE
  MutNoSignalOnStale = FALSE
  MutNoDedup = FALSE
  MutNoDirectAddLevelCheck = FALSE
  MutNoRoomCheck = FALSE
  MutGcReadLevel = FALSE
  MutNoGapSignal = FALSE
  MutNoReloadSignal = FALSE
  MutDrainedAckIgnoresOutstanding = FALSE
INVARIANTS
  TypeInv
  MemWindow
  AckBelowRead
  ReadBelowMaxRead
  LoadedInDb
  LoadedBounded
  NoAckSkipped
  GCOnlyAcked
  NoReDispatch
  NoDbAckBackwards
  NoWriteDup
PROPERTIES
  ReadLevelMonotonic
  AckLevelMonotonic
  DbAckLevelMonotonic
  AllTasksAcked
  EventuallyDrained
  ReaderQuiesce
  EventuallyCaughtUp
CHECK_DEADLOCK FALSE
