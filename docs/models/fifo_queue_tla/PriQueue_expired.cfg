\* Expired tasks may appear in any position, including an entirely expired
\* backlog or an expired tail after valid tasks complete. With successful
\* writes, the reader must catch up and persist the final acknowledgement.
SPECIFICATION PriSpec
CONSTANTS
  MaxLevel = 3
  InitLevels = 3
  BatchSize = 2
  ReloadAt = 1
  RangeSize = 1
  ScanIters = 2
  WBatchMax = 2
  AckableLevels = {1, 2, 3}
  Expirable = {1, 2, 3}
  WriteErrors = FALSE
  ReadErrors = TRUE
  MutStaleGapLevels = FALSE
  MutNoAckedTaskFilter = FALSE
  MutDbAckBackwards = FALSE
  MutSignalAlwaysOnGap = FALSE
  MutNoSignalOnStale = FALSE
  MutNoDedup = FALSE
  MutNoDirectAddLevelCheck = FALSE
  MutNoRoomCheck = FALSE
  MutGcReadLevel = FALSE
  MutNoGapSignal = FALSE
  MutNoReloadSignal = FALSE
  MutDrainedAckIgnoresOutstanding = FALSE
  MutGapAckRequiresEqualLevels = FALSE
INVARIANTS
  TypeInv
  MemWindow
  AckBelowRead
  ReadBelowMaxRead
  LoadedInDb
  LoadedBounded
  NoAckSkipped
  GCOnlyAcked
  NoReDispatch
  NoDbAckBackwards
  NoWriteDup
PROPERTIES
  ReadLevelMonotonic
  AckLevelMonotonic
  DbAckLevelMonotonic
  AllTasksAcked
  EventuallyDrained
  ReaderQuiesce
  EventuallyCaughtUp
