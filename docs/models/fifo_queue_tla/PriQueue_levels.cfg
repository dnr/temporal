\* Levels-only view: just the "levels never move backwards / no task is
\* dispatched twice" claims, so a mutation reports those rather than the
\* bookkeeping invariant (MemWindow) that happens to trip first.
SPECIFICATION PriSpec
CONSTANTS
  MaxLevel = 3
  InitLevels = 1
  BatchSize = 2
  ReloadAt = 1
  RangeSize = 1
  ScanIters = 2
  WBatchMax = 2
  AckableLevels = {1, 2, 3}
  Expirable = {}
  WriteErrors = TRUE
  ReadErrors = TRUE
  MutStaleGapLevels = FALSE
  MutNoAckedTaskFilter = FALSE
  MutDbAckBackwards = FALSE
  MutSignalAlwaysOnGap = FALSE
  MutNoSignalOnStale = FALSE
  MutNoDedup = FALSE
  MutNoDirectAddLevelCheck = FALSE
  MutNoRoomCheck = FALSE
  MutGcReadLevel = FALSE
  MutNoGapSignal = FALSE
  MutNoReloadSignal = FALSE
  MutDrainedAckIgnoresOutstanding = FALSE
INVARIANTS
  NoReDispatch
  NoDbAckBackwards
PROPERTIES
  ReadLevelMonotonic
  AckLevelMonotonic
  DbAckLevelMonotonic
CHECK_DEADLOCK FALSE
