\* Safety only at MaxLevel = 4 (liveness at 4 is too slow for the routine
\* suite). Run before big changes for broader invariant coverage.
SPECIFICATION PriSpec
CONSTANTS
  MaxLevel = 4
  InitLevels = 2
  BatchSize = 2
  ReloadAt = 1
  RangeSize = 1
  ScanIters = 2
  WBatchMax = 2
  AckableLevels = {1, 2, 3, 4}
  Expirable = {}
  WriteErrors = TRUE
  ReadErrors = TRUE
  MutStaleGapLevels = FALSE
  MutNoAckedTaskFilter = FALSE
  MutDbAckBackwards = FALSE
  MutSignalAlwaysOnGap = FALSE
  MutNoSignalOnStale = FALSE
  MutNoDedup = FALSE
  MutNoDirectAddLevelCheck = FALSE
  MutNoRoomCheck = FALSE
  MutGcReadLevel = FALSE
  MutNoGapSignal = FALSE
  MutNoReloadSignal = FALSE
  MutDrainedAckIgnoresOutstanding = FALSE
INVARIANTS
  TypeInv
  MemWindow
  AckBelowRead
  ReadBelowMaxRead
  LoadedInDb
  LoadedBounded
  NoAckSkipped
  GCOnlyAcked
  NoReDispatch
  NoDbAckBackwards
  NoWriteDup
CHECK_DEADLOCK FALSE
