\* Ownership model, safety + liveness (no VIEW: dead-owner state isn't
\* collapsed). GcMode is overridden by run_owners.sh; "unfenced" (current
\* code) fails safety already.
SPECIFICATION FairSpec
CONSTANTS
  MaxLevel = 2
  BatchTarget = 2
  ReloadAt = 1
  WBatchMax = 1
  EvictedCacheMax = 1
  NumOwners = 2
  ReadTimeouts = FALSE
  WriteTimeouts = FALSE
  Expiry = FALSE
  GcMode = "unfenced"
  TakeoverCAS = FALSE
  WriterMayStop = TRUE
INVARIANTS
  TypeInv
  GCOnlyAcked
  PersistedAckSafe
  NoAckSkipped
  LoadedInDb
  MemWindow
  AckBelowRead
  LoadedBounded
  CacheBounded
  CacheOnlyAcked
  PinProtectsWrites
PROPERTIES
  AckLevelMonotonic
  AllTasksAcked
  EventuallyDrained
CHECK_DEADLOCK FALSE
