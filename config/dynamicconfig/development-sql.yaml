limit.maxIDLength:
  - value: 255
    constraints: {}
frontend.workerVersioningDataAPIs:
  - value: true
frontend.workerVersioningWorkflowAPIs:
  - value: true
frontend.workerVersioningRuleAPIs:
  - value: true
system.enableDeploymentVersions:
  - value: true
system.enableDeployments:
  - value: true
component.nexusoperations.callback.endpoint.template:
  - value: http://localhost:7243/namespaces/{{.NamespaceName}}/nexus/callback
callback.allowedAddresses:
  - value:
      - Pattern: "*"
        AllowInsecure: true
matching.queryWorkflowTaskTimeoutLogRate:
  - value: 1.0
history.ReplicationEnableUpdateWithNewTaskMerge:
  - value: true
history.hostLevelCacheMaxSize:
  - value: 8192
history.enableTransitionHistory:
  - value: true
history.enableChasm:
  - value: true
activity.enableStandalone:
  - value: true

matching.useNewMatcher:
  - value: true

matching.partitionScaleManager:
  - value:
      BatchSize: 10
      BackgroundInterval: "5s"
      DrainBufferTime: "5s"
      AllowedDelta: 1
      AllowedRatio: 1.5

matching.simplePartitionScaler:
  - value:
      Enabled: true
      Ups:
        - Window: "10s"
          TargetRate: 10
      Downs:
        - Window: "10s"
          TargetRate: 20

matching.backlogMetricsEmitInterval:
  - value: "0s"

